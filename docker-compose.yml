version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true # Cô lập Database khỏi truy cập ngoài (Hardening)

volumes:
  pgdata:
  pgadmin_data:
  grafana_data:
  loki_data:

services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: clinic-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-clinic_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      POSTGRES_DB: ${DB_NAME:-clinic_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true

  # 2. Công cụ quản lý Database pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: clinic-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@clinic.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-AdminPassword123!}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - frontend-net
      - backend-net
    security_opt:
      - no-new-privileges:true

  # 3. Ứng dụng Web Quản lý Phòng khám
  clinic-web:
    image: nginx:alpine # Có thể thay bằng image app Node.js/Python của bạn
    container_name: clinic-app
    restart: always
    user: "1000:1000" # Run as non-root user (Hardening)
    environment:
      DATABASE_URL: postgres://${DB_USER:-clinic_user}:${DB_PASSWORD:-SecurePassword123!}@postgres-db:5432/${DB_NAME:-clinic_db}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - postgres-db
    security_opt:
      - no-new-privileges:true

  # 4. Nginx Reverse Proxy
  nginx-proxy:
    image: nginx:alpine
    container_name: clinic-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /var/log/nginx:/var/log/nginx
    networks:
      - frontend-net
    depends_on:
      - clinic-web
    security_opt:
      - no-new-privileges:true

  # 5. Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: clinic-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - frontend-net

  # 6. Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: clinic-grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - frontend-net

  # 7. Loki Log System
  loki:
    image: grafana/loki:latest
    container_name: clinic-loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    networks:
      - frontend-net

  # 8. Promtail Log Collector
  promtail:
    image: grafana/promtail:latest
    container_name: clinic-promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - frontend-net
